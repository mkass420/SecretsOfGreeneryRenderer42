name: Build and Package

on:
  push:
    branches: [ "master", "kikita" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # xvfb is for GUI tests
          # binutils, fakeroot, rpm are for jpackage to build .deb and .rpm installers
          sudo apt-get install -y xvfb binutils fakeroot rpm

      - name: Build and Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            # Use xvfb-run to simulate a display for JavaFX tests
            xvfb-run mvn package -B
          else
            mvn package -B
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-${{ matrix.os }}
          path: |
            target/*.exe
            target/*.msi
            target/*.dmg
            target/*.pkg
            target/*.deb
            target/*.rpm
            target/*.zip